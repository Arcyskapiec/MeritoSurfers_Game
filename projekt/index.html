<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game_window"></div>
    <!-- JD edit -->
    <!-- <button id="btn_game_start">start</button> -->
    <!-- JD edit -->

    <!--JD edit-->
<div id="menu_container">
    <!-- KROK 1: Ekran główny -->
    <div id="screen_main" class="menu_screen">
        <h1>WSB Surfers</h1>
        <button id="btn_menu_start" class="menu_btn">Start</button>
        <button id="btn_menu_leaderboard" class="menu_btn">Leaderboard</button>
    </div>

    <!-- KROK 2: Nick -->
    <div id="screen_nickname" class="menu_screen" style="display: none;">
        <h2>Podaj nick, wariacie</h2>
        <input id="input_nickname" type="text" placeholder="Najlepszy WSB surfer to..." />
        <button id="btn_nickname_next" class="menu_btn">Dalej</button>
        <button id="btn_nickname_back" class="menu_btn">Wróć</button>
    </div>

    <!-- KROK 3: Wybór postaci -->
    <div id="screen_character" class="menu_screen" style="display: none;">
        <h2>Wybierz postać</h2>
        <div id="character_list">
            <button class="character_btn" data-character="AK"><img src="./img/characters/AK/tmp_character.png" alt="AK"><span>AK</span></button>
            <button class="character_btn" data-character="AS"><img src="./img/characters/AS/AS_run_1.png" alt="AS"><span>AS</span></button>
            <button class="character_btn" data-character="JD"><img src="./img/characters/JD/tmp_character.png" alt="JD"><span>JD</span></button>
            <button class="character_btn" data-character="NN"><img src="./img/characters/NN/tmp_character.png" alt="NN"><span>NN</span></button>
            <button class="character_btn" data-character="OV"><img src="./img/characters/OV/tmp_character.png" alt="OV"><span>OV</span></button>
        </div>
        <button id="btn_character_back" class="menu_btn">Wróć</button>
    </div>
</div>
<!--JD edit-->
</body>
<script type="module" src="game/JavaScript/game.js"></script>
</html>
